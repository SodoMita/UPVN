name: Build Dist

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-addon:
    name: Build add-on zip + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          sudo apt-get update -y && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (quick gate)
        run: python -m pytest tests/ -q

      - name: Build add-on zip
        run: |
          python tools/package_addon.py dist
          ls -lh dist/
          unzip -l dist/upvn_editor_addon_v*.zip | head -n 100

      - name: Build game templates (linux / windows / macOS)
        run: |
          python tools/package_template.py dist
          ls -lh dist/
          unzip -l dist/upvn-game-template-linux-x64.zip | head -n 40

      - name: Validate zip can be imported (self-containment proof)
        run: |
          python - << 'PY'
          import zipfile, pathlib, sys, tempfile, os
          zips=list(pathlib.Path('dist').glob('upvn_editor_addon_v*.zip'))
          if not zips:
              raise SystemExit("no addon zip found")
          z=zips[-1]
          print(f"Checking {z}")
          with zipfile.ZipFile(z) as zf:
              names=zf.namelist()
              assert any(n.endswith('__init__.py') for n in names), "missing __init__.py"
              assert any('engine/script/parser.py' in n for n in names), "missing engine/script/parser.py"
              assert any('bge_frontend/frontend.py' in n for n in names), "missing frontend"
              print(f"OK {len(names)} entries")
          PY

      - name: Upload add-on zip
        uses: actions/upload-artifact@v4
        with:
          name: upvn-addon-dist
          path: dist/upvn_editor_addon_v*.zip
          if-no-files-found: error

      - name: Upload game-template zips
        uses: actions/upload-artifact@v4
        with:
          name: upvn-game-templates
          path: dist/upvn-game-template-*.zip
          if-no-files-found: error

  runnable-linux:
    name: Runnable linux zip (bundled blenderplayer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update -y && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Cache UPBGE 0.50 tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache
          key: upbge-0.50-linux-x64

      - name: Download + extract UPBGE
        env:
          CACHE: ${{ runner.temp }}/upbge-cache
        run: |
          mkdir -p "$CACHE" "$RUNNER_TEMP/upbge"
          TAR="$CACHE/upbge-0.50-linux-x64.tar.xz"
          if [ ! -f "$TAR" ]; then
            curl -L --retry 5 -o "$TAR.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-linux-x64.tar.xz
            mv "$TAR.partial" "$TAR"
          fi
          tar -xJf "$TAR" -C "$RUNNER_TEMP/upbge"
          test -x "$RUNNER_TEMP/upbge/upbge-0.50-linux-x64/blenderplayer"

      - name: Build self-contained linux zip
        run: |
          python tools/package_template.py dist --platforms linux \
            --with-player "$RUNNER_TEMP/upbge/upbge-0.50-linux-x64"
          ls -lh dist/upvn-runnable-linux-x64.7z
          7z l dist/upvn-runnable-linux-x64.7z | head -n 30

      - name: Upload runnable linux zip
        uses: actions/upload-artifact@v4
        with:
          name: upvn-runnable-linux
          path: dist/upvn-runnable-linux-x64.7z
          if-no-files-found: error

  runnable-windows:
    name: Runnable windows zip (bundled blenderplayer.exe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update -y && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Cache UPBGE 0.50 windows 7z
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache
          key: upbge-0.50-windows-x64

      - name: Download + extract UPBGE windows
        env:
          CACHE: ${{ runner.temp }}/upbge-cache
        run: |
          mkdir -p "$CACHE" "$RUNNER_TEMP/upbge-win"
          ARC="$CACHE/upbge-0.50-windows-x64.7z"
          if [ ! -f "$ARC" ]; then
            curl -L --retry 5 -o "$ARC.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-windows-x64.7z
            mv "$ARC.partial" "$ARC"
          fi
          7z x -y -o"$RUNNER_TEMP/upbge-win" "$ARC"
          test -n "$(find "$RUNNER_TEMP/upbge-win" -name blenderplayer.exe | head -1)"

      - name: Build self-contained windows zip
        run: |
          python tools/package_template.py dist --platforms windows \
            --with-player "$RUNNER_TEMP/upbge-win"
          ls -lh dist/upvn-runnable-windows-x64.7z
          7z l dist/upvn-runnable-windows-x64.7z | head -n 40

      - name: Upload runnable windows zip
        uses: actions/upload-artifact@v4
        with:
          name: upvn-runnable-windows
          path: dist/upvn-runnable-windows-x64.7z
          if-no-files-found: error
