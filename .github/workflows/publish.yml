name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.7.1) — leave empty to use bl_info"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Tests (pre-publish gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        run: python -m pytest tests/ -q

  build:
    name: Build dist artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # read from bl_info
            V=$(python -c "import re; t=open('blend/upvn_editor_addon.py').read(); m=re.search(r'\"version\":\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)', t); print('.'.join(m.groups()))")
            echo "tag=v$V" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

      - name: Build add-on zip
        run: |
          python tools/package_addon.py dist
          ls -lh dist/

      - name: Build game templates (linux / windows / macOS)
        run: |
          python tools/package_template.py dist
          ls -lh dist/upvn-game-template-*.zip

      - name: Cache UPBGE 0.50 linux tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache
          key: upbge-0.50-linux-x64

      - name: Cache UPBGE 0.50 windows 7z
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache-win
          key: upbge-0.50-windows-x64

      - name: Build runnable linux zip (bundled blenderplayer)
        run: |
          mkdir -p "${{ runner.temp }}/upbge-cache" "${{ runner.temp }}/upbge"
          TAR="${{ runner.temp }}/upbge-cache/upbge-0.50-linux-x64.tar.xz"
          if [ ! -f "$TAR" ]; then
            curl -L --retry 5 -o "$TAR.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-linux-x64.tar.xz
            mv "$TAR.partial" "$TAR"
          fi
          tar -xJf "$TAR" -C "${{ runner.temp }}/upbge"
          python tools/package_template.py dist --platforms linux \
            --with-player "${{ runner.temp }}/upbge/upbge-0.50-linux-x64"
          ls -lh dist/upvn-runnable-linux-x64.zip

      - name: Build runnable windows zip (bundled blenderplayer.exe)
        run: |
          sudo apt-get update -y && sudo apt-get install -y p7zip-full
          mkdir -p "${{ runner.temp }}/upbge-cache-win" "${{ runner.temp }}/upbge-win"
          ARC="${{ runner.temp }}/upbge-cache-win/upbge-0.50-windows-x64.7z"
          if [ ! -f "$ARC" ]; then
            curl -L --retry 5 -o "$ARC.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-windows-x64.7z
            mv "$ARC.partial" "$ARC"
          fi
          7z x -y -o"${{ runner.temp }}/upbge-win" "$ARC"
          python tools/package_template.py dist --platforms windows \
            --with-player "${{ runner.temp }}/upbge-win"
          ls -lh dist/upvn-runnable-windows-x64.zip

      - name: Build sample game package (optional, non-blocking)
        continue-on-error: true
        run: |
          python tools/package_game.py --project examples/10_full_sample_game --out dist || echo "package_game failed (non-blocking)"
          python tools/package_game.py --project examples/99_creator_demo --out dist || echo "99 demo package failed"
          ls -lh dist/ || true

      - name: Collect changelog for this version
        id: changelog
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          VER=${TAG#v}
          # Extract section ## VER from CHANGELOG.md, fallback to first 80 lines
          python3 << PY
          import pathlib, re
          tag="${{ steps.ver.outputs.tag }}"
          ver=tag.lstrip('v')
          text=pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8', errors='ignore')
          # Find ## <ver> section
          pattern = rf'^##\s+{re.escape(ver)}\b.*?(?=^##\s+|\Z)'
          m=re.search(pattern, text, flags=re.M|re.S)
          if m:
              body=m.group(0).strip()
          else:
              # fallback first 120 lines
              body="\n".join(text.splitlines()[:120])
          # Write to file for release
          pathlib.Path('/tmp/release_notes.md').write_text(body, encoding='utf-8')
          print(body[:2000])
          PY
          echo "notes_path=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Upload dist artifact (CI view)
        uses: actions/upload-artifact@v4
        with:
          name: upvn-dist-${{ steps.ver.outputs.tag }}
          path: |
            dist/*.zip
            dist/*.md
            dist/*.json
            dist/*.pot
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: UPVN ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/upvn_editor_addon_v*.zip
            dist/upvn-game-template-linux-x64.zip
            dist/upvn-game-template-windows-x64.zip
            dist/upvn-game-template-macos-arm64.zip
            dist/upvn-runnable-linux-x64.zip
            dist/upvn-runnable-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Optional: publish docs / pages if needed in future
  # Keeping job separate so publish.yml stays minimal and reliable.
