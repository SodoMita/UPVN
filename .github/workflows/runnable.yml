name: Runnable players

# Big ~170 MB linux/windows 7z with bundled blenderplayer.
# Not on main or agent/* — those stay small (addon + templates).
# Push or merge to `build` for CI artifacts; `v*` tags attach them
# to a GitHub Release via publish.yml.
# Also publishes a player-only tree as tag upbge-player-0.50 for CI/agents.
on:
  push:
    branches: [build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runnable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runnable-linux:
    name: Runnable linux 7z (bundled blenderplayer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update -y && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Cache UPBGE 0.50 tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache
          key: upbge-0.50-linux-x64

      - name: Download + extract UPBGE
        env:
          CACHE: ${{ runner.temp }}/upbge-cache
        run: |
          mkdir -p "$CACHE" "$RUNNER_TEMP/upbge"
          TAR="$CACHE/upbge-0.50-linux-x64.tar.xz"
          if [ ! -f "$TAR" ]; then
            curl -L --retry 5 -o "$TAR.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-linux-x64.tar.xz
            mv "$TAR.partial" "$TAR"
          fi
          tar -xJf "$TAR" -C "$RUNNER_TEMP/upbge"
          test -x "$RUNNER_TEMP/upbge/upbge-0.50-linux-x64/blenderplayer"

      - name: Build self-contained linux 7z + player-only
        run: |
          python tools/package_template.py dist --platforms linux \
            --with-player "$RUNNER_TEMP/upbge/upbge-0.50-linux-x64"
          python tools/package_template.py dist --player-only --platforms linux \
            --with-player "$RUNNER_TEMP/upbge/upbge-0.50-linux-x64"
          ls -lh dist/upvn-runnable-linux-x64.7z dist/upvn-upbge-player-0.50-linux-x64.7z
          7z l dist/upvn-runnable-linux-x64.7z | head -n 20

      - name: Upload runnable linux 7z
        uses: actions/upload-artifact@v4
        with:
          name: upvn-runnable-linux
          path: dist/upvn-runnable-linux-x64.7z
          if-no-files-found: error

      - name: Upload slim UPBGE player (linux)
        uses: actions/upload-artifact@v4
        with:
          name: upvn-upbge-player-linux
          path: dist/upvn-upbge-player-0.50-linux-x64.7z
          if-no-files-found: error

      - name: Publish slim player tag upbge-player-0.50 (linux)
        if: github.ref == 'refs/heads/build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upbge-player-0.50
          name: UPBGE 0.50 stripped player (UPVN)
          body: |
            Player-only blenderplayer tree for CI smoke and agents.
            No editor. Recreate when UPBGE_VERSION changes: bump it in
            tools/package_template.py and merge to `build`.
          files: dist/upvn-upbge-player-0.50-linux-x64.7z
          fail_on_unmatched_files: true
          make_latest: false

  runnable-windows:
    name: Runnable windows 7z (bundled blenderplayer.exe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: sudo apt-get update -y && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Cache UPBGE 0.50 windows 7z
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upbge-cache
          key: upbge-0.50-windows-x64

      - name: Download + extract UPBGE windows
        env:
          CACHE: ${{ runner.temp }}/upbge-cache
        run: |
          mkdir -p "$CACHE" "$RUNNER_TEMP/upbge-win"
          ARC="$CACHE/upbge-0.50-windows-x64.7z"
          if [ ! -f "$ARC" ]; then
            curl -L --retry 5 -o "$ARC.partial" \
              https://github.com/UPBGE/upbge/releases/download/v0.50/upbge-0.50-windows-x64.7z
            mv "$ARC.partial" "$ARC"
          fi
          7z x -y -o"$RUNNER_TEMP/upbge-win" "$ARC"
          test -n "$(find "$RUNNER_TEMP/upbge-win" -name blenderplayer.exe | head -1)"

      - name: Build self-contained windows 7z + player-only
        run: |
          python tools/package_template.py dist --platforms windows \
            --with-player "$RUNNER_TEMP/upbge-win"
          python tools/package_template.py dist --player-only --platforms windows \
            --with-player "$RUNNER_TEMP/upbge-win"
          ls -lh dist/upvn-runnable-windows-x64.7z dist/upvn-upbge-player-0.50-windows-x64.7z
          7z l dist/upvn-runnable-windows-x64.7z | head -n 20

      - name: Upload runnable windows 7z
        uses: actions/upload-artifact@v4
        with:
          name: upvn-runnable-windows
          path: dist/upvn-runnable-windows-x64.7z
          if-no-files-found: error

      - name: Upload slim UPBGE player (windows)
        uses: actions/upload-artifact@v4
        with:
          name: upvn-upbge-player-windows
          path: dist/upvn-upbge-player-0.50-windows-x64.7z
          if-no-files-found: error

      - name: Publish slim player tag upbge-player-0.50 (windows)
        if: github.ref == 'refs/heads/build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upbge-player-0.50
          name: UPBGE 0.50 stripped player (UPVN)
          body: |
            Player-only blenderplayer tree for CI smoke and agents.
            No editor. Recreate when UPBGE_VERSION changes: bump it in
            tools/package_template.py and merge to `build`.
          files: dist/upvn-upbge-player-0.50-windows-x64.7z
          fail_on_unmatched_files: true
          make_latest: false
